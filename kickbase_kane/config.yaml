name: Kickbase Kane
version: "0.2.11"
slug: kickbase_kane
description: Privates Kickbase-Trading-Dashboard mit taeglichen Marktwertprognosen.
url: https://github.com/bastiwe/Kickbase-Kane
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:soccer
panel_title: Kickbase
init: false
map:
  - addon_config:rw
options:
  kick_user: ""
  kick_pass: ""
  league_name: "Die Spätzünder"
  email_user: ""
  email_pass: ""
  openai_api_key: ""
  openai_model: "gpt-5-mini"
  report_times: "21:40,22:10"
schema:
  kick_user: str
  kick_pass: password
  league_name: str
  email_user: str?
  email_pass: password?
  openai_api_key: password?
  openai_model: str
  report_times: str
