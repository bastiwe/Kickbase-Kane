name: Kickbase Kane
version: "0.1.1"
slug: kickbase_kane
description: Privates Kickbase-Dashboard mit taeglichen Marktwertprognosen und Startelf-Optimierer.
url: https://github.com/bastiwe/Kickbase-Kane
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:soccer
panel_title: Kickbase
init: false
map:
  - addon_config:rw
options:
  kick_user: ""
  kick_pass: ""
  league_name: "Die Spätzünder"
  openai_api_key: ""
  openai_model: "gpt-5-mini"
  report_time: "22:15"
schema:
  kick_user: str
  kick_pass: password
  league_name: str
  openai_api_key: password?
  openai_model: str
  report_time: match(^([01]?[0-9]|2[0-3]):[0-5][0-9]$)
