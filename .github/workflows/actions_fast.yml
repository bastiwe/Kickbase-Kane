name: Run Fast 1T Predictions

on:
  workflow_dispatch:

jobs:
  run-fast-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Restore player data cache
        id: player-data-cache
        uses: actions/cache/restore@v5
        with:
          path: player_data_total.db
          key: ${{ runner.os }}-kickbase-player-data-fast-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kickbase-player-data-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily_predictions_fast.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          KICK_USER: ${{ secrets.KICK_USER }}
          KICK_PASS: ${{ secrets.KICK_PASS }}
        run: |
          python daily_predictions_fast.py

      - name: Save player data cache
        if: hashFiles('player_data_total.db') != ''
        uses: actions/cache/save@v5
        with:
          path: player_data_total.db
          key: ${{ steps.player-data-cache.outputs.cache-primary-key }}
