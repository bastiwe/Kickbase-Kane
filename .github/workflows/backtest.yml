name: Run Model Backtest

on:
  schedule:
    - cron: '30 21 * * *'  # 23:30 in Germany during daylight saving time
    - cron: '30 22 * * *'  # 23:30 in Germany during standard time
  workflow_dispatch:

jobs:
  run-model-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Check Berlin run time
        id: berlin-time
        shell: bash
        run: |
          berlin_time="$(TZ=Europe/Berlin date +%H%M)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             { [ "$berlin_time" -ge 2330 ] && [ "$berlin_time" -le 2359 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.berlin-time.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.berlin-time.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Restore player data cache
        if: steps.berlin-time.outputs.run == 'true'
        id: player-data-cache
        uses: actions/cache/restore@v5
        with:
          path: player_data_total.db
          key: ${{ runner.os }}-kickbase-player-data-backtest-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kickbase-player-data-

      - name: Install dependencies
        if: steps.berlin-time.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run model_backtest.py
        if: steps.berlin-time.outputs.run == 'true'
        env:
          KICK_USER: ${{ secrets.KICK_USER }}
          KICK_PASS: ${{ secrets.KICK_PASS }}
          BACKTEST_DAYS: '30'
          BACKTEST_MODEL_N_ESTIMATORS: '300'
        run: |
          python model_backtest.py

      - name: Save player data cache
        if: steps.berlin-time.outputs.run == 'true' && hashFiles('player_data_total.db') != ''
        uses: actions/cache/save@v5
        with:
          path: player_data_total.db
          key: ${{ steps.player-data-cache.outputs.cache-primary-key }}

      - name: Save model backtest summary cache
        if: steps.berlin-time.outputs.run == 'true' && hashFiles('model_backtest_summary.json') != ''
        uses: actions/cache/save@v5
        with:
          path: model_backtest_summary.json
          key: ${{ runner.os }}-kickbase-model-backtest-${{ github.run_id }}

      - name: Upload model backtest summary
        if: steps.berlin-time.outputs.run == 'true' && hashFiles('model_backtest_summary.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: model-backtest-summary
          path: model_backtest_summary.json
