name: Run S11 Strategy Report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s11-strategy-report
  cancel-in-progress: false

jobs:
  s11-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore player history
        id: player-data-cache
        uses: actions/cache/restore@v5
        with:
          path: player_data_total.db
          key: ${{ runner.os }}-kickbase-player-data-s11-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kickbase-player-data-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test S11 strategy and standalone delivery
        run: python -m unittest discover -s tests -p 'test_*strategy*.py' -v

      - name: Generate and email standalone S11 report
        env:
          KICK_USER: ${{ secrets.KICK_USER }}
          KICK_PASS: ${{ secrets.KICK_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          KICK_LEAGUE_NAME: ${{ vars.KICK_LEAGUE_NAME || 'Die Spätzünder' }}
        run: python -u s11_strategy_report.py

      - name: Upload S11 strategy
        if: ${{ !cancelled() && hashFiles('s11_strategy_report.html') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: s11-strategy-report
          path: |
            s11_strategy_report.html
            s11_strategy_report.json
          if-no-files-found: error
          retention-days: 7

      - name: Save player history
        if: ${{ success() && hashFiles('player_data_total.db') != '' }}
        uses: actions/cache/save@v5
        with:
          path: player_data_total.db
          key: ${{ steps.player-data-cache.outputs.cache-primary-key }}

      - name: Save completed 1T forecasts
        if: ${{ success() && hashFiles('prediction_snapshot_1t.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: prediction_snapshot_1t.json
          key: ${{ runner.os }}-kickbase-1t-forecast-${{ github.run_id }}-${{ github.run_attempt }}
