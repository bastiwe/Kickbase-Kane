name: Run Daily Predictions Spaet

on:
  schedule:
    - cron: '20 19 * * *'  # 21:20 in Germany during daylight saving time
    - cron: '10 20 * * *'  # 22:10 in Germany during daylight saving time
    - cron: '20 20 * * *'  # 21:20 in Germany during standard time
    - cron: '10 21 * * *'  # 22:10 in Germany during standard time
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kickbase-manager-history
  cancel-in-progress: false

jobs:
  run-daily-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Check Berlin run time
        id: berlin-time
        shell: bash
        run: |
          berlin_time="$(TZ=Europe/Berlin date +%H%M)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             { [ "$berlin_time" -ge 2120 ] && [ "$berlin_time" -le 2145 ]; } || \
             { [ "$berlin_time" -ge 2210 ] && [ "$berlin_time" -le 2239 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.berlin-time.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.berlin-time.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Restore player data cache
        if: steps.berlin-time.outputs.run == 'true'
        id: player-data-cache
        uses: actions/cache/restore@v5
        with:
          path: player_data_total.db
          key: ${{ runner.os }}-kickbase-player-data-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kickbase-player-data-

      - name: Restore model backtest summary
        if: steps.berlin-time.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: model_backtest_summary.json
          key: ${{ runner.os }}-kickbase-model-backtest-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kickbase-model-backtest-

      - name: Install dependencies
        if: steps.berlin-time.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cumulative manager history
        if: steps.berlin-time.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/restore_manager_history.py

      - name: Run daily_predictions_spaet.py
        if: steps.berlin-time.outputs.run == 'true'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          KICK_USER: ${{ secrets.KICK_USER }}
          KICK_PASS: ${{ secrets.KICK_PASS }}
        run: |
          python daily_predictions_spaet.py

      - name: Upload dashboard forecast snapshot
        if: ${{ success() && hashFiles('prediction_snapshot_1t.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: kickbase-forecast-snapshot
          path: prediction_snapshot_1t.json
          retention-days: 14

      - name: Upload lineup optimizer
        if: steps.berlin-time.outputs.run == 'true' && hashFiles('startelf_optimizer.html') != ''
        uses: actions/upload-artifact@v6
        with:
          name: startelf-optimizer
          path: startelf_optimizer.html

      - name: Save cumulative manager history
        if: ${{ !cancelled() && steps.berlin-time.outputs.run == 'true' && hashFiles('manager_history.sqlite3') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: manager-history
          path: manager_history.sqlite3
          retention-days: 90

      - name: Save manager audit
        if: ${{ !cancelled() && steps.berlin-time.outputs.run == 'true' && hashFiles('manager-history-output/latest.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: manager-audit
          path: manager-history-output/
          retention-days: 90

      - name: Save completed 1T forecasts
        if: ${{ !cancelled() && steps.berlin-time.outputs.run == 'true' && hashFiles('prediction_snapshot_1t.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: prediction_snapshot_1t.json
          key: ${{ runner.os }}-kickbase-1t-forecast-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save player data cache
        if: steps.berlin-time.outputs.run == 'true' && hashFiles('player_data_total.db') != ''
        uses: actions/cache/save@v5
        with:
          path: player_data_total.db
          key: ${{ steps.player-data-cache.outputs.cache-primary-key }}
