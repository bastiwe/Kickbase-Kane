name: Run Daily Predictions Spaet

on:
  schedule:
    - cron: '45 19 * * *'  # 21:45 in Germany during daylight saving time
    - cron: '45 20 * * *'  # 21:45 in Germany during standard time
  workflow_dispatch:

jobs:
  run-daily-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Check Berlin run time
        id: berlin-time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/Berlin date +%H)" = "21" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.berlin-time.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.berlin-time.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.berlin-time.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily_predictions_spaet.py
        if: steps.berlin-time.outputs.run == 'true'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          KICK_USER: ${{ secrets.KICK_USER }}
          KICK_PASS: ${{ secrets.KICK_PASS }}
        run: |
          python daily_predictions_spaet.py
