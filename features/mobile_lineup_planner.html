q('market-player').innerHTML='<option value="">Transfermarktspieler wählen</option>'+[...MARKET].filter(p=>!purchases.has(p.id)).sort((a,b)=>expiryTime(a)-expiryTime(b)||String(a.name).localeCompare(String(b.name),'de')).map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+esc(p.team||'Verein unbekannt')+' · '+euro(p.mv)+'</option>').join('');
q('simulated').innerHTML=[...purchases].map(([id,cost])=>{let player=M.get(id);return '<div class="simulated-row"><span><strong>'+esc(player.name)+'</strong><br>MW '+euro(player.mv)+' · Kaufpreis '+euro(cost)+'</span><button type="button" data-remove-buy="'+id+'">Entfernen</button></div>'}).join('')}
document.addEventListener('click',e=>{let chosen=e.target.closest('[data-candidate]'),close=e.target.closest('[data-close-candidates]');if(close){closeCandidates();return}if(chosen&&candidateSlot!==null){let id=chosen.dataset.candidate,slot=candidateSlot;closeCandidates();place(id,slot);return}let sale=e.target.closest('[data-sell]'),hold=e.target.closest('[data-lock]');if(sale){let id=sale.dataset.sell;if(locked.has(id)){msg('Spieler ist als unverkäuflich markiert.');return}if(sell.has(id)){sell.delete(id);msg('Verkauf zurückgenommen.')}else{sell.add(id);msg('Als Verkauf markiert.')}render();return}if(hold){let id=hold.dataset.lock;if(locked.has(id)){locked.delete(id);msg('Halte-Markierung entfernt.')}else{locked.add(id);sell.delete(id);msg('Spieler wird nicht verkauft.')}render();return}let f=e.target.closest('[data-form]');if(f){form=f.dataset.form;best();return}let s=e.target.closest('[data-slot]');if(s&&pick){place(pick,+s.dataset.slot);return}if(s&&!sel[+s.dataset.slot]){openCandidates(+s.dataset.slot);return}let p=e.target.closest('[data-player]');if(!p)return;let id=p.dataset.player;if(sel.includes(id)){sel[sel.indexOf(id)]=null;if(!locked.has(id)&&!purchases.has(id))sell.add(id);render();return}pick=pick===id?null:id;if(pick)msg('Startelfplatz für '+(M.get(id)?.name||'Spieler')+' wählen.');render()});
document.addEventListener('dragstart',e=>{let p=e.target.closest('[data-player]');if(p){drag=p.dataset.player;e.dataTransfer.setData('text/plain',drag)}});
document.addEventListener('dragover',e=>{if(drag&&(e.target.closest('[data-slot]')||e.target.closest('#bank')))e.preventDefault()});
document.addEventListener('drop',e=>{let s=e.target.closest('[data-slot]'),bank=e.target.closest('#bank');if(s&&drag){e.preventDefault();place(drag,+s.dataset.slot)}else if(bank&&drag){e.preventDefault();let i=sel.indexOf(drag);if(i>=0){sel[i]=null;if(!locked.has(drag)&&!purchases.has(drag))sell.add(drag);render()}}drag=null});
document.addEventListener('touchstart',e=>{let p=e.target.closest('[data-player]');if(p)touch={id:p.dataset.player,x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',e=>{if(!touch.id)return;let t=e.changedTouches[0],dx=t.clientX-touch.x;if(dx>70){if(locked.has(touch.id)){msg('Spieler ist als unverkäuflich markiert.');touch={};return}let i=sel.indexOf(touch.id);if(i>=0)sel[i]=null;if(!purchases.has(touch.id))sell.add(touch.id);msg('Als Verkauf markiert und auf die Bank gesetzt.');render()}else if(dx<-70){if(locked.has(touch.id)){locked.delete(touch.id);msg('Halte-Markierung entfernt.')}else{locked.add(touch.id);sell.delete(touch.id);msg('Spieler wird nicht verkauft.')}render()}touch={}},{passive:true});
q('best').onclick=best;
q('bench').onclick=()=>{sel=Array(11).fill(null);syncBenchSales();render()};
q('deficit').onchange=e=>{allowDeficit=e.target.checked;render()};
q('apply').onclick=async()=>{let selected=sel.filter(Boolean),simulated=selected.filter(id=>purchases.has(id));if(selected.length!==11||new Set(selected).size!==11){msg('Für Kickbase werden genau 11 unterschiedliche Spieler benötigt.');return}if(simulated.length){msg('Simulierte Käufe können nicht an Kickbase übertragen werden.');return}let button=q('apply');button.disabled=true;button.textContent='Übertrage …';try{let response=await fetch('./api/apply-lineup',{method:'POST',headers:{'Content-Type':'application/json','X-Advisor-Token':S.csrf},body:JSON.stringify({state:{formation:form,selection:sel}})}),body=await response.json();if(!response.ok)throw Error(body.error||'Übertragung fehlgeschlagen');msg('Aufstellung '+form+' wurde in Kickbase gespeichert.')}catch(error){msg(error.message||'Kickbase-Aufstellung konnte nicht gespeichert werden.')}finally{button.disabled=false;button.textContent='In Kickbase übernehmen'}};
q('simulate').onclick=()=>{let id=q('market-player').value,player=MARKET.find(p=>p.id===id),overpay=Math.max(0,Number(q('overpay').value)||0);if(!player){msg('Bitte einen Transfermarktspieler wählen.');return}if(!M.has(id)){P.push(player);M.set(id,player)}purchases.set(id,player.mv+overpay);sell.delete(id);
q('overpay').value='';msg(player.name+' als Kauf simuliert.');render()};
document.addEventListener('click',e=>{let button=e.target.closest('[data-remove-buy]');if(!button)return;let id=button.dataset.removeBuy;purchases.delete(id);P=P.filter(player=>player.id!==id);M.delete(id);sell.delete(id);sel=sel.map(value=>value===id?null:value);msg('Simulierter Kauf entfernt.');render()});
q('live').textContent=S.liveMessage||'';fetch('./api/current-lineup',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(l=>{let k=String(l.formation||'').replace(/\D/g,''),found=Object.keys(F).find(x=>x.replace(/-/g,'')===k);if(!found||!Array.isArray(l.players))return;form=found;let ids=l.players.map(String),used=new Set();sel=F[form].map(pos=>{let id=ids.find(id=>M.get(id)?.position===pos&&!used.has(id));if(id)used.add(id);return id||null});syncBenchSales();render()}).catch(best);render()})();
</script></body></html>
